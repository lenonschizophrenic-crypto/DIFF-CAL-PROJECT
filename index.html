<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculus Vasebreaker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      color: #facc15;
      font-size: 1.6rem;
      letter-spacing: 1px;
    }

    /* Scoreboard */
    .dashboard {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
      font-size: 0.95rem;
      font-weight: bold;
    }

    /* 5x5 Responsive Grid Layout */
    .grid-5x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 400px;
    }

    .jar {
      height: 72px;
      background: #334155;
      border: 2px solid #64748b;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
    }

    .jar:active {
      transform: scale(0.92);
    }

    .jar.broken {
      background: #0f172a !important;
      border: 2px dashed #334155;
      font-size: 1.4rem;
      cursor: default;
    }

    /* Status Bar */
    .status-bar {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #94a3b8;
      height: 24px;
      text-align: center;
      font-weight: 500;
    }

    /* Modal Popup for Math Traps */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #ef4444;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-card h3 {
      color: #ef4444;
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .problem-box {
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
      font-size: 1.3rem;
      margin: 16px 0;
      color: #facc15;
      border: 1px solid #334155;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 2px solid #334155;
      outline: none;
      text-align: center;
      margin-bottom: 12px;
      background: #ffffff;
      color: #000000;
    }

    input[type="text"]:focus {
      border-color: #facc15;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #facc15;
      border: none;
      border-radius: 8px;
      color: #000000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active {
      background: #eab308;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>🔨 CALCULUS VASEBREAKER</h1>
  </header>

  <div class="dashboard">
    <div>🏺 Jars Left: <span id="jars-left" style="color:#facc15">25</span></div>
    <div>❤️ HP: <span id="hp" style="color:#ef4444">100</span></div>
    <div>⭐ Score: <span id="score" style="color:#22c55e">0</span></div>
  </div>

  <div class="grid-5x5" id="grid"></div>

  <div class="status-bar" id="status">Tap any jar to swing your hammer!</div>

  <!-- Math Trap Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <h3>⚠️ MATH TRAP!</h3>
      <p style="font-size:0.85rem; color:#94a3b8;">Solve the derivative to smash the jar!</p>
      
      <div class="problem-box" id="problem-text">f(x) = x^3</div>
      
      <input type="text" id="answer-input" placeholder="e.g. 3x^2" autocomplete="off">
      <button onclick="submitAnswer()">SWING HAMMER!</button>
    </div>
  </div>

  <script>
    let currentJar = null;
    let currentCorrectAnswer = "";
    let jarsLeft = 25;
    let score = 0;
    let hp = 100;

    const grid = document.getElementById('grid');

    // Generate 25 Identical Jars
    for (let i = 0; i < 25; i++) {
      const jar = document.createElement('div');
      jar.className = 'jar';
      jar.innerText = '🏺';
      jar.onclick = () => smashJar(jar);
      grid.appendChild(jar);
    }

    function smashJar(jarEl) {
      if (jarEl.classList.contains('broken') || hp <= 0) return;
      currentJar = jarEl;

      // 40% Chance for Lucky Smash (No Question)
      // 60% Chance for Unlucky Math Trap
      const isLucky = Math.random() < 0.4;

      if (isLucky) {
        // LUCKY DROP
        const rewards = ['🪙 +100 Coins', '⭐ +150 Points', '💖 +20 HP', '☀️ Sun Drop'];
        const reward = rewards[Math.floor(Math.random() * rewards.length)];

        jarEl.innerText = reward.split(' ')[0]; // Display icon
        jarEl.classList.add('broken');

        jarsLeft--;
        score += 150;
        document.getElementById('status').innerText = `🎉 LUCKY! Free smash! Got: ${reward}`;
        updateDashboard();
      } else {
        // UNLUCKY MATH TRAP: Random Derivative Generation
        const n = Math.floor(Math.random() * 4) + 2;     // Exponent (2 to 5)
        const coeff = Math.floor(Math.random() * 4) + 1; // Coefficient (1 to 4)

        // Derivative: d/dx (coeff * x^n) = (coeff * n) * x^(n - 1)
        const newCoeff = coeff * n;
        const newExp = n - 1;

        // Build expected derivative string format (e.g. "6x^2" or "4x")
        currentCorrectAnswer = newExp === 1 ? `${newCoeff}x` : `${newCoeff}x^${newExp}`;

        const funcText = coeff === 1 ? `x^${n}` : `${coeff}x^${n}`;
        document.getElementById('problem-text').innerText = `Find d/dx (${funcText})`;
        document.getElementById('answer-input').value = '';
        document.getElementById('modal').style.display = 'flex';
        
        // Auto-focus input for convenience
        setTimeout(() => document.getElementById('answer-input').focus(), 100);
      }
    }

    function submitAnswer() {
      // Normalize user answer (remove spaces, convert to lowercase)
      const userAns = document.getElementById('answer-input').value.toLowerCase().replace(/\s+/g, '');
      const expectedAns = currentCorrectAnswer.toLowerCase().replace(/\s+/g, '');

      if (!userAns) return;

      document.getElementById('modal').style.display = 'none';

      if (userAns === expectedAns) {
        // Correct Answer
        currentJar.innerText = '💥';
        currentJar.classList.add('broken');
        jarsLeft--;
        score += 100;
        document.getElementById('status').innerText = `✅ SMASH! Correct answer: ${currentCorrectAnswer}`;
      } else {
        // Incorrect Answer
        hp -= 20;
        document.getElementById('status').innerText = `❌ WRONG! Answer was ${currentCorrectAnswer}. Lost 20 HP!`;
      }

      updateDashboard();
    }

    function updateDashboard() {
      document.getElementById('jars-left').innerText = jarsLeft;
      document.getElementById('score').innerText = score;
      document.getElementById('hp').innerText = Math.max(0, hp);

      if (jarsLeft === 0) {
        document.getElementById('status').innerText = "🏆 VICTORY! All jars cleared!";
      } else if (hp <= 0) {
        document.getElementById('status').innerText = "💀 GAME OVER! You ran out of HP!";
      }
    }
  </script>
</body>
</html>
